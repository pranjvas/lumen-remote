<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lumen Agent</title>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080c; color: #e9e4da; font-family: sans-serif; }
    .glow { position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, rgba(255,170,90,.18), transparent 45%), radial-gradient(circle at 75% 65%, rgba(90,140,255,.14), transparent 50%); }
    .card { position: absolute; left: 160px; top: 160px; right: 160px; }
    h1 { font-weight: 300; font-size: 72px; letter-spacing: .04em; margin: 0 0 24px; }
    p { font-size: 30px; opacity: .75; margin: 0 0 12px; }
    #status { font-size: 26px; opacity: .6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <h1>Lumen Agent</h1>
    <p>Probe build: reads what this TV's runtime exposes for the Lumen Remote.</p>
    <p>Press Back to close.</p>
    <div id="status">starting…</div>
  </div>
  <script src="main.js"></script>
</body>
</html>
